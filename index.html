<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1216">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon-192.png">
<title>Volleyball Stats</title>
<script>try{var t=localStorage.getItem('vbstats.theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;}catch(e){}</script>
<style>
  /* Colour tokens. Dark is the default; light follows the phone's setting
     unless someone picks one with the header toggle (data-theme on <html>).
     Every light value was contrast-checked: text >= 4.5:1 on all surfaces,
     shot-chart hit/tip pair re-validated for colour-blind separation. */
  :root{
    --bg:#0f1216; --panel:#171b21; --panel2:#1e242c; --line:#2a323c;
    --fg:#e8edf3; --muted:#93a1b1; --dim:#808c9a;
    --accent:#4da3ff; --good:#3ecf8e; --bad:#ff6b6b; --warn:#ffc857;
    --hover:#242c36; --hover-line:#3c4653; --hover2:#252d38; --press:#2c343f; --well:#0f1319;
    --on-accent:#06121f; --accent-hover:#69b2ff; --good-ink:#7de5b8; --bad-ink:#ff9b9b;
    --header-bg:rgba(15,18,22,.93); --nav-bg:rgba(23,27,33,.97); --row-hover:rgba(255,255,255,.025);
    --court:#0d1116; --court-floor:#141a21; --court-line:#3a4553; --court-bound:#93a1b1;
    --court-label:#66727f; --court-chip:#1e242c;
    /* shot chart: colour = where the hitter took off; validated all-pairs (lines cross) */
    --from-l:#d6395a; --from-m:#c98500; --from-r:#3987e5; --from-b:#7d8896;
    --radius:10px;
    color-scheme:dark;
    font-synthesis-weight:none;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#f4f6f9; --panel:#ffffff; --panel2:#eef1f5; --line:#d5dbe3;
      --fg:#121821; --muted:#47525f; --dim:#5b6674;
      --accent:#1d68c9; --good:#0f7a4b; --bad:#b83232; --warn:#8a5d00;
      --hover:#e4e9ef; --hover-line:#b9c3cf; --hover2:#e4e9ef; --press:#d9e0e8; --well:#e3e8ef;
      --on-accent:#ffffff; --accent-hover:#2f7ad8; --good-ink:#0f7a4b; --bad-ink:#b83232;
      --header-bg:rgba(244,246,249,.93); --nav-bg:rgba(255,255,255,.97); --row-hover:rgba(0,0,0,.03);
      --court:#e9edf2; --court-floor:#f7f9fb; --court-line:#c5cdd7; --court-bound:#6b7785;
      --court-label:#7a8594; --court-chip:#ffffff;
      --from-l:#c4304a; --from-m:#b08300; --from-r:#2a78d6; --from-b:#8b95a2;
      color-scheme:light;
    }
  }
  :root[data-theme="light"]{
      --bg:#f4f6f9; --panel:#ffffff; --panel2:#eef1f5; --line:#d5dbe3;
      --fg:#121821; --muted:#47525f; --dim:#5b6674;
      --accent:#1d68c9; --good:#0f7a4b; --bad:#b83232; --warn:#8a5d00;
      --hover:#e4e9ef; --hover-line:#b9c3cf; --hover2:#e4e9ef; --press:#d9e0e8; --well:#e3e8ef;
      --on-accent:#ffffff; --accent-hover:#2f7ad8; --good-ink:#0f7a4b; --bad-ink:#b83232;
      --header-bg:rgba(244,246,249,.93); --nav-bg:rgba(255,255,255,.97); --row-hover:rgba(0,0,0,.03);
      --court:#e9edf2; --court-floor:#f7f9fb; --court-line:#c5cdd7; --court-bound:#6b7785;
      --court-label:#7a8594; --court-chip:#ffffff;
      --from-l:#c4304a; --from-m:#b08300; --from-r:#2a78d6; --from-b:#8b95a2;
      color-scheme:light;
    }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--fg);
    font:14px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:60px;
  }
  button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
  input,select{
    font:inherit; color:var(--fg); background:var(--panel2);
    border:1px solid var(--line); border-radius:7px; padding:7px 9px;
  }
  input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
  .num{font-variant-numeric:tabular-nums}

  /* ---------- top bar ---------- */
  header{
    position:sticky;top:0;z-index:30;background:var(--header-bg);
    backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
  }
  .bar{display:flex;align-items:center;gap:14px;padding:10px 16px;flex-wrap:wrap}
  .brand{font-weight:700;letter-spacing:-.2px;font-size:15px;white-space:nowrap}
  .brand span{color:var(--accent)}
  nav{display:flex;gap:2px;margin-left:auto;background:var(--panel);padding:3px;border-radius:9px}
  nav button{padding:6px 13px;border-radius:7px;color:var(--muted);font-weight:600;font-size:13px}
  nav button:hover{color:var(--fg)}
  nav button.on{background:var(--panel2);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.35)}

  main{max-width:1180px;margin:0 auto;padding:18px 16px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px}
  h2{margin:0 0 12px;font-size:15px;letter-spacing:-.2px}
  h3{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);font-weight:700}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .spacer{flex:1}
  .empty{color:var(--dim);padding:22px;text-align:center;font-size:13px}

  .btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 13px;font-weight:600;font-size:13px}
  .btn:hover{background:var(--hover);border-color:var(--hover-line)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  .btn.primary:hover{background:var(--accent-hover)}
  .btn.danger{color:var(--bad)}
  .btn.sm{padding:4px 9px;font-size:12px}
  .btn:disabled{opacity:.4;cursor:not-allowed}

  /* ---------- scoreboard ---------- */
  .score{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center;
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:14px}
  .side{display:flex;flex-direction:column;gap:6px;min-width:0}
  .side.b{align-items:flex-end}
  .side .nm{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .side .pts{font-size:40px;font-weight:800;line-height:1;letter-spacing:-2px}
  .side .ctl{display:flex;gap:5px}
  .side .ctl button{flex:0 0 auto;width:30px;height:26px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;font-weight:700;color:var(--muted)}
  .side .ctl button:hover{color:var(--fg);background:var(--hover)}
  .mid{text-align:center;color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.1em;font-weight:700}
  .mid .setno{font-size:13px;color:var(--fg);margin-bottom:4px;letter-spacing:0;text-transform:none}
  /* own full-width row: in the centre column it claimed ~194px and squashed
     the score +/- buttons to 26px on a phone */
  .setpills{grid-column:1/-1;display:flex;gap:4px;justify-content:center;margin-top:2px;flex-wrap:wrap}
  .setpills button{padding:3px 9px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);
    font-size:11px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
  .setpills button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

  /* ---------- tally ---------- */
  .tally{display:grid;grid-template-columns:290px 1fr;gap:14px;align-items:start}
  /* grid items default to min-width:auto, so one wide descendant (the roster
     strip, a long log line) blows the track out past the viewport and drags
     every panel with it. Pin it to 0 and let scroll containers scroll. */
  .tally > *{min-width:0}
  /* Box Score team switch: phones only — a desktop shows both teams stacked */
  /* .teamtabs.boxteams, not .boxteams: .teamtabs (display:flex) is declared
     later in this sheet and would otherwise win and show it on a desktop */
  .teamtabs.boxteams{display:none;margin:11px 0 0}
  @media(max-width:820px){.tally{grid-template-columns:1fr}}
  .teamtabs{display:flex;gap:3px;background:var(--panel2);padding:3px;border-radius:8px;margin-bottom:10px}
  .teamtabs button{flex:1;padding:7px;border-radius:6px;font-weight:700;font-size:12px;color:var(--muted);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .teamtabs button.on{background:var(--accent);color:var(--on-accent)}
  .roster{display:flex;flex-direction:column;gap:5px;max-height:430px;overflow:auto}
  .pchip{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:8px;
    background:var(--panel2);border:1px solid var(--line);text-align:left;width:100%}
  .pchip:hover{background:var(--hover)}
  .pchip.on{border-color:var(--accent);background:rgba(77,163,255,.14);box-shadow:inset 0 0 0 1px var(--accent)}
  .pchip .no{min-width:26px;height:22px;display:grid;place-items:center;border-radius:5px;background:var(--well);
    font-weight:800;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
  .pchip.on .no{background:var(--accent);color:var(--on-accent)}
  .pchip .pn{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pchip .pos{margin-left:auto;font-size:11px;color:var(--dim);font-weight:700;letter-spacing:.05em}

  .cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
  .cat{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:11px}
  .cat h3{margin-bottom:8px}
  .sbtns{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .sbtn{position:relative;padding:11px 8px 9px;border-radius:8px;background:var(--panel);
    border:1px solid var(--line);font-weight:700;font-size:12.5px;text-align:center;line-height:1.2}
  .sbtn:hover{background:var(--hover2);transform:translateY(-1px)}
  .sbtn:active{transform:translateY(0)}
  .sbtn.good{border-color:rgba(62,207,142,.4);color:var(--good-ink)}
  .sbtn.bad{border-color:rgba(255,107,107,.35);color:var(--bad-ink)}
  .sbtn .kb{display:block;font-size:10px;color:var(--dim);font-weight:700;margin-top:3px;letter-spacing:.06em}
  .sbtn .ct{position:absolute;top:4px;right:6px;font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
  .live{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:11px}
  .live span{background:var(--panel2);border:1px solid var(--line);border-radius:7px;
    padding:5px 10px;font-size:11px;color:var(--dim);font-weight:700;
    text-transform:uppercase;letter-spacing:.05em}
  .live b{font-size:15px;color:var(--fg);margin-right:4px;letter-spacing:-.3px}
  .live .ta{border-color:rgba(77,163,255,.4)}
  .live .ta b{color:var(--accent)}
  .live .hp.pos b{color:var(--good)} .live .hp.neg b{color:var(--bad)}
  .nosel{padding:26px;text-align:center;color:var(--dim);font-size:13px;
    background:var(--panel2);border:1px dashed var(--line);border-radius:9px}

  .log{display:flex;flex-direction:column;gap:4px;max-height:190px;overflow:auto}
  .log .ev{display:flex;gap:9px;align-items:center;padding:5px 9px;background:var(--panel2);
    border-radius:6px;font-size:12px;border:1px solid transparent}
  .log .ev{width:100%;text-align:left;min-height:36px}
  .log .ev:hover{border-color:var(--line)}
  .log .ev .s{font-weight:700}
  .log .ev .t{color:var(--dim);margin-left:auto;font-variant-numeric:tabular-nums;font-size:11px}

  /* ---------- tables ---------- */
  .tw{overflow-x:auto;border:1px solid var(--line);border-radius:9px}
  table{border-collapse:collapse;width:100%;font-size:12.5px;min-width:760px}
  th,td{padding:7px 9px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
  th{background:var(--panel2);color:var(--dim);font-size:11px;text-transform:uppercase;
    letter-spacing:.06em;font-weight:800;position:sticky;top:0;cursor:help}
  th:first-child,td:first-child{text-align:center;width:44px}
  th:nth-child(2),td:nth-child(2){text-align:left}
  tbody tr:hover{background:var(--row-hover)}
  tbody tr:last-child td{border-bottom:none}
  tr.tot{background:var(--panel2);font-weight:800}
  tr.tot td{border-top:2px solid var(--line)}
  td.num{font-variant-numeric:tabular-nums}
  .pos{color:var(--good)} .neg{color:var(--bad)}
  .grp{border-left:1px solid var(--line)}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:9px;margin-bottom:13px}
  .kpi{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:11px 13px}
  .kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--dim);font-weight:800}
  .kpi .v{font-size:22px;font-weight:800;letter-spacing:-.5px;margin-top:3px;font-variant-numeric:tabular-nums}

  .list{display:flex;flex-direction:column;gap:7px}
  .item{display:flex;align-items:center;gap:11px;padding:10px 13px;background:var(--panel2);
    border:1px solid var(--line);border-radius:9px}
  .item .ttl{font-weight:700;font-size:13.5px}
  .mitem .acts{display:flex;gap:6px;align-items:center}
  .mitem .ttl .badge{margin-left:6px;vertical-align:2px}
  .setsel{display:none}
  details.fullbox > summary{display:none}
  .item .sub{font-size:11.5px;color:var(--dim)}
  .item.on{border-color:var(--accent)}
  .badge{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
    padding:2px 7px;border-radius:20px;background:rgba(77,163,255,.16);color:var(--accent)}

  /* ============ court / attack placement ============ */
  .place{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:9px 11px;margin-bottom:12px}
  .place summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;
    font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--dim);
    min-height:30px}
  .place summary::-webkit-details-marker{display:none}
  .place summary::after{content:'▾';margin-left:auto;font-size:11px}
  .place[open] summary::after{content:'▴'}
  .place[open] summary{margin-bottom:7px}
  .fine{font-size:11px;color:var(--dim);font-weight:700;text-transform:none;letter-spacing:0}
  .shotsel{display:flex;gap:3px;background:var(--panel);padding:3px;border-radius:8px}
  .shotsel button{padding:6px 14px;border-radius:6px;font-size:12px;font-weight:700;color:var(--muted);min-height:34px}
  .shotsel button.on{background:var(--accent);color:var(--on-accent)}

  .court{background:var(--court);border:1px solid var(--line);border-radius:9px;padding:8px}
  .court .net{text-align:center;font-size:11px;letter-spacing:.2em;color:var(--dim);font-weight:800;
    border-bottom:2px solid var(--accent);padding-bottom:4px;margin-bottom:7px}
  .zones{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
  .zone{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
    min-height:52px;border-radius:7px;border:1px solid var(--line);padding:5px 3px;
    transition:background .12s}
  /* the zone number is the identifier, so it must stay legible on the darkest fill */
  .zone .zn{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.05em}
  .zone .zc{font-size:17px;font-weight:800;letter-spacing:-.5px;line-height:1.1;color:var(--fg)}
  .zone .zd{font-size:11px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
  .cscale{display:flex;align-items:center;gap:3px;margin-top:7px;font-size:11px;color:var(--dim);font-weight:700}
  .cscale i{width:17px;height:9px;border-radius:2px;border:1px solid var(--line);display:block}
  .zchip{font-size:11px;font-weight:800;letter-spacing:.04em;padding:1px 6px;border-radius:20px;
    background:rgba(77,163,255,.16);color:var(--accent)}

  /* ============ shot chart ============
     Colour = where the hitter took off: power red, middle yellow, right side
     blue, back row / unknown grey. Red vs yellow is the hard pair for
     red-green colour blindness, so these exact shades were picked by running
     the all-pairs check (lines cross) in both themes; a brighter yellow is
     distinct but out-weighs the other two on the dark court. Shot type is the end mark (hit circle, tip diamond) and
     outcome is line style (solid kill / dashed not a kill), so nothing rests
     on colour alone. */
  .shots{display:block;width:100%;max-width:400px;margin:0 auto;height:auto;background:var(--court);border:1px solid var(--line);
    border-radius:9px;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  .shots .floor{fill:var(--court-floor)}
  .shots .ln{stroke:var(--court-line);stroke-width:.5;fill:none}
  .shots .bound{stroke:var(--court-bound);stroke-width:.8;fill:none}
  .shots .netl{stroke:var(--fg);stroke-width:1.4}
  .shots .zl{fill:var(--court-label);font-size:5px;font-weight:800;text-anchor:middle;dominant-baseline:middle}
  .shots .sidel{fill:var(--court-label);font-size:3.4px;font-weight:800;letter-spacing:.3px;text-anchor:middle}
  /* thin and slightly translucent: a full match is 60+ lines, and where they
     pile up the overlap itself should read as "they go here a lot" */
  .shots .mk{stroke-width:.75;stroke-linecap:round;fill:none;opacity:.8}
  .shots .mk.miss{stroke-dasharray:2 1.6;stroke-width:.55;opacity:.5}
  .shots .end{stroke:var(--court);stroke-width:.6}
  .shots .end.miss{fill:var(--court);stroke-width:1}
  .shots .from{cursor:pointer}
  .shots .from rect{fill:var(--court-chip);stroke:var(--court-line);stroke-width:.6}
  .shots .from.on rect{fill:var(--accent);stroke:var(--accent)}
  .shots .ptick circle{fill:var(--dim)}
  .shots .ptick text{fill:var(--dim);font-size:3.2px;font-weight:800;text-anchor:middle}
  .shots .ptick.on circle{fill:var(--accent)}
  .shots .ptick.on text{fill:var(--accent)}
  .shots .ptick[data-pplay]{cursor:pointer}
  .shots .from text{fill:var(--muted);font-size:3.4px;font-weight:800;text-anchor:middle;dominant-baseline:middle}
  .shots .from.on text{fill:var(--on-accent)}
  .shots .tapzone{cursor:crosshair}
  /* court lines sit above the tap surface; let taps fall through them */
  .shots .ln,.shots .bound,.shots .netl,.shots .sidel{pointer-events:none}
  /* a filter group names itself, so a row of pills never has to be decoded */
  .fgroup{display:flex;align-items:center;gap:6px}
  .flabel{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);white-space:nowrap}
  table.mini tr[data-placeplay]{cursor:pointer}
  table.mini tr[data-placeplay]:hover{background:rgba(77,163,255,.08)}
  table.mini tr.sel{background:rgba(77,163,255,.16);font-weight:800}
  table.mini tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
  .slegend{display:flex;flex-wrap:wrap;gap:4px 13px;margin-top:7px;font-size:11px;color:var(--muted);font-weight:600;align-items:center}
  .slegend svg{width:22px;height:10px;vertical-align:middle;margin-right:4px}

  /* ============ placement popup ============ */
  .modal{position:fixed;inset:0;z-index:90;background:rgba(5,7,10,.72);display:flex;
    align-items:center;justify-content:center;padding:12px}
  .modal[hidden]{display:none}
  .sheet{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:100%;max-width:440px;
    max-height:100%;overflow:auto;padding:13px 14px;box-shadow:0 18px 50px rgba(0,0,0,.6)}
  .sheet .hd{display:flex;align-items:center;gap:9px;margin-bottom:9px}
  .sheet .hd h2{margin:0;font-size:15px}
  .sheet .hd .x{margin-left:auto;width:36px;height:36px;border-radius:8px;font-size:20px;color:var(--muted)}
  .sheet .ctl{display:flex;align-items:center;gap:9px;margin-bottom:8px}
  .sheet .ft{display:flex;gap:8px;margin-top:10px}
  .digrow{margin-bottom:8px}
  .digrow .fine{display:block;margin-bottom:4px}
  .digs{display:flex;gap:5px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
  .digs::-webkit-scrollbar{height:0}
  .digs button{flex:0 0 auto;min-width:44px;min-height:44px;padding:0 9px;border-radius:8px;
    background:var(--panel2);border:1px solid var(--line);font-weight:800;font-size:13px;color:var(--muted)}
  .digs button.on{background:var(--good);border-color:var(--good);color:var(--on-accent)}
  .sheet .ft .btn{flex:1;min-height:44px}
  @media(max-width:700px){
    .modal{align-items:flex-end;padding:0}
    .sheet{border-radius:16px 16px 0 0;padding-bottom:calc(13px + env(safe-area-inset-bottom))}
    /* 44px minimum touch target, like every other control on the phone layout */
    .sheet .shotsel button{min-height:44px;padding:6px 12px;font-size:13px}
    .sheet .ctl{gap:7px}
    .sheet .hd .x{width:44px;height:44px}
  }

  /* small numeric tables: no name column, so every count right-aligns */
  table.mini{min-width:0}
  table.mini th:nth-child(2),table.mini td:nth-child(2){text-align:right}
  .pgrid2{display:grid;grid-template-columns:minmax(0,360px) 1fr;gap:16px;align-items:start}
  @media(max-width:700px){.pgrid2{grid-template-columns:1fr;gap:11px}}
  .psum p{margin:0 0 9px;font-size:13px;color:var(--muted)}

  /* ============ phone pad ============

  .pbtn{position:relative;min-height:68px;border-radius:13px;background:var(--panel2);

    /* roster becomes a sticky horizontal strip of jersey numbers */

      scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}

      color:var(--fg);padding:0}

      list-style:none;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;

  .themebtn{order:3;width:34px;height:34px;display:grid;place-items:center;border-radius:9px;
    border:1px solid var(--line);background:var(--panel);color:var(--muted);font-size:16px;line-height:1}

  .syncpill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;color:var(--muted);
    background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:4px 10px;white-space:nowrap}
  .syncpill[hidden]{display:none}

</head>
<body>

<header>
  <div class="bar">
    <div class="brand">🏐 Volleyball <span>Stats</span></div>
    <button class="syncpill" id="syncpill" hidden data-v-sync title="Shared data"></button>
    <button class="themebtn" id="themebtn" type="button"></button>
    <nav>
      <button data-v="match" class="on">Match</button>
      <button data-v="box">Box Score</button>
      <button data-v="teams">Teams</button>
      <button data-v="matches">Matches</button>
    </nav>
  </div>
</header>

<main id="app"></main>
<div class="toast" id="toast"></div>
<!-- lives outside #app so a re-render underneath never wipes it -->
<div class="modal" id="placeModal" hidden><div class="sheet" id="placeSheet" role="dialog" aria-modal="true"></div></div>

<!-- Supabase client, vendored so the app still loads offline. Only used once
     someone signs in to shared data; until then nothing leaves the device. -->
<script src="./vendor/supabase-js-2.117.3.js"></script>
<script>
/* ============================================================
   Volleyball Stats — 100% local. All data lives in this
   browser's localStorage under the key below. Nothing is sent
   anywhere. Use Matches → Export to back up / move machines.
   ============================================================ */
const KEY = 'vbstats.v1';

/* ---------- stat definitions ---------- */
/* tier 1 = thumb-sized button on the phone pad (the nine you tap live);
   tier 2 = behind "More stats". Desktop shows all of them by category. */
const STATS = [
  // key            label            cat         tone   kb  tier short
  ['kill',          'Kill',          'Attack',   'good','K', 1],
  ['attackErr',     'Attack Error',  'Attack',   'bad', 'E', 1, 'Att Error'],
  ['attack0',       'Kept in Play',  'Attack',   '',    'A', 1, 'In Play'],

  ['ace',           'Ace',           'Serve',    'good','S', 1],
  ['serveErr',      'Serve Error',   'Serve',    'bad', 'X', 1, 'Serve Err'],
  ['serve0',        'Serve in Play', 'Serve',    '',    'W', 2, 'Serve In'],

  ['pass3',         'Pass 3',        'Reception','good','3', 2],
  ['pass2',         'Pass 2',        'Reception','',    '2', 2],
  ['pass1',         'Pass 1',        'Reception','',    '1', 2],
  ['recErr',        'Recv Error',    'Reception','bad', '0', 2, 'Recv Err'],

  ['assist',        'Assist',        'Set',      'good','T', 1],
  ['setErr',        'Ball Hdl Err',  'Set',      'bad', 'Y', 2, 'Hdl Error'],

  ['blockSolo',     'Block Solo',    'Block',    'good','B', 1, 'Solo Block'],
  ['blockAssist',   'Block Assist',  'Block',    'good','N', 1, 'Block Ast'],
  ['blockErr',      'Block Error',   'Block',    'bad', 'M', 2, 'Block Err'],

  ['dig',           'Dig',           'Defense',  'good','D', 1],
  ['digErr',        'Dig Error',     'Defense',  'bad', 'F', 2, 'Dig Error'],
].map(([key,label,cat,tone,kb,tier,short])=>({key,label,cat,tone,kb,tier,short:short??label}));

/* ---------- attack placement ----------
   Zones are the standard rotation positions OF THE TEAM BEING ATTACKED,
   drawn net-at-top exactly like a rotation sheet: 4-3-2 front, 5-6-1 back.
   Location is optional — an attack with no zone still counts everywhere. */
const ZONE_ORDER   = [4,3,2,5,6,1];
const ATTACK_STATS = new Set(['kill','attackErr','attack0']);
const SHOTS        = [['hit','Hit'],['tip','Tip']];
const SHOT_LABEL   = Object.fromEntries(SHOTS);

/* Where the hitter took off — the start of each line on the shot chart.
   Named by volleyball position rather than left/right: the power side is the
   hitter's left, which lands on the right of the drawing because you look at
   them across the net, and "left" there read backwards. Keys stay L/M/R/B. */
const FROMS      = [['L','Power'],['M','Middle'],['R','Right side'],['B','Back row']];
const FROM_LABEL = Object.fromEntries(FROMS);
const FROM_BY_POS = {OH:'L', MB:'M', OPP:'R'};
/* Set type for an attack from the middle. Optional, and only offered when the
   take-off is Middle. Edit this list to match your team's play calls.
   Calls follow the standard two-digit system: the FIRST digit is which 1 m
   slot along the net it's hit from, counted from the hitter's left (power-side)
   antenna, 1-9; the second is the set's height / tempo. So a 30 is hit about
   2.5 m in from the power side — off-centre — not from the middle of the net,
   a 51 is at the centre and a 60 about 1 m right of it. Any call added here is
   positioned from its first digit; nothing else needs changing. */
const MIDDLE_PLAYS = ['30','51','60'];
/* where along the net (chart x) a middle set is hit from. Slot z is centred
   (z - 0.5) m from the hitter's left antenna, which is the RIGHT end of the
   drawing, as you see them across the net. */
function playX(code){
  const z = parseInt(String(code)[0], 10);
  return z >= 1 && z <= 9 ? COURT - (z - 0.5) * CM : null;
}

/* Court geometry for the shot chart, in SVG units (10 per metre).
   The landing half is 9 m x 9 m with the net along y=0 and the 3 m line at
   y=30; the hitter's side is drawn above the net, cropped to 4.5 m. */
const CM = 10, COURT = 9*CM, LINE3 = 3*CM, THEIRS = 4.5*CM;
const FROM_XY = {L:[75,-16], M:[45,-16], R:[15,-16], B:[45,-38]};
/* a middle set leaves from its slot, right at the net, with room above for its label */
const PLAY_Y = -3;
/* zone from a landing point: columns are 3 m wide, rows split at the 3 m line */
function zoneAt(x, y){
  const col = x < 30 ? 0 : x < 60 ? 1 : 2;
  return (y < LINE3 ? [4,3,2] : [5,6,1])[col];
}
/* attacks recorded before exact spots existed only know their zone: put them
   in that zone with a stable per-event scatter so they don't stack on one pixel */
const ZONE_XY = {4:[15,15],3:[45,15],2:[75,15],5:[15,60],6:[45,60],1:[75,60]};
function landing(ev){
  if(ev.x != null) return [ev.x, ev.y];
  if(!ev.zone) return null;
  let h = 0; for(const ch of ev.id) h = (h*31 + ch.charCodeAt(0)) >>> 0;
  const [cx, cy] = ZONE_XY[ev.zone];
  return [cx + ((h % 17) - 8), cy + (((h >> 5) % 17) - 8)];
}

const CATS = [...new Set(STATS.map(s=>s.cat))];
const STAT_BY_KB = Object.fromEntries(STATS.map(s=>[s.kb.toLowerCase(),s.key]));
const STAT_LABEL = Object.fromEntries(STATS.map(s=>[s.key,s.label]));
const POSITIONS = ['','OH','OPP','MB','S','L','DS'];

/* ---------- persistence ---------- */
const blank = () => ({teams:[], matches:[], activeMatch:null, ui:{}});
let S = load();
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return blank();
    return Object.assign(blank(), JSON.parse(raw));
  }catch(e){ console.error('load failed',e); return blank(); }
}
function save(){
  ensureStamps();
  localStorage.setItem(KEY, JSON.stringify(S));
  schedulePush();
}
const uid = () => Math.random().toString(36).slice(2,10);
/* A random id for this install, put on every stat it records, so Undo only
   ever takes back this device's own last tap once several people record. */
const DEVICE = (() => {
  let d = localStorage.getItem('vbstats.device');
  if(!d){ d = uid() + uid(); localStorage.setItem('vbstats.device', d); }
  return d;
})();

/* Creation stamps give every team, player, match and stat one order that all
   devices agree on (array position doesn't survive a merge). Anything without
   one is stamped in its current order, so existing data keeps its order. */
let lastStamp = 0;
const stamp = () => (lastStamp = Math.max(Date.now(), lastStamp + 1));
function ensureStamps(){
  for(const t of S.teams){ t.c ??= stamp(); for(const p of t.players) p.c ??= stamp(); }
  for(const m of S.matches){ m.c ??= stamp(); for(const ev of m.events) ev.t ??= stamp(); }
}

/* ---------- lookups ---------- */
const team    = id => S.teams.find(t=>t.id===id);
const match   = id => S.matches.find(m=>m.id===id);
const current = () => match(S.activeMatch);
/* The Box Score can show any match without changing which one the Match tab
   records into; it falls back to the active match. */
const boxMatch = () => match(S.ui.boxMatch) ?? current();
function player(pid){
  for(const t of S.teams){ const p=t.players.find(p=>p.id===pid); if(p) return p; }
  return null;
}
const teamName = id => team(id)?.name ?? 'Unknown';

/* ---------- aggregation ----------
   Events are the source of truth; every table is a reduce over
   them. That keeps undo exact and lets any set be filtered out
   after the fact without re-entering anything.                */
const zero = () => Object.fromEntries(STATS.map(s=>[s.key,0]));

function tally(m, filter={}){
  const out = {};
  for(const ev of m.events){
    if(filter.set && ev.set !== filter.set) continue;
    if(filter.teamId && ev.teamId !== filter.teamId) continue;
    const k = ev.playerId || ('TEAM:'+ev.teamId);
    (out[k] ??= zero())[ev.stat]++;
  }
  return out;
}
function sumRows(rows){
  const t = zero();
  for(const r of rows) for(const s of STATS) t[s.key] += r[s.key];
  return t;
}

/* derived columns */
const attempts   = r => r.kill + r.attackErr + r.attack0;
const hitPct     = r => attempts(r) ? (r.kill - r.attackErr) / attempts(r) : null;
const killPct    = r => attempts(r) ? r.kill / attempts(r) : null;
const serveTot   = r => r.ace + r.serveErr + r.serve0;
const recTot     = r => r.pass3 + r.pass2 + r.pass1 + r.recErr;
const passRating = r => recTot(r) ? (3*r.pass3 + 2*r.pass2 + 1*r.pass1) / recTot(r) : null;
const recPct     = r => recTot(r) ? (recTot(r) - r.recErr) / recTot(r) : null;
const blockTot   = r => r.blockSolo + r.blockAssist/2;
const points     = r => r.kill + r.ace + r.blockSolo + r.blockAssist/2;
const errors     = r => r.attackErr + r.serveErr + r.recErr + r.setErr + r.blockErr + r.digErr;

/* Attacks broken out by landing zone. Returns per-zone tallies plus the
   attacks that were recorded without a location, which must stay visible —
   otherwise the court silently under-reports and looks authoritative. */
function placement(m, teamId, {playerId=null, shot=null, set=null, play=null}={}){
  const grid = {}, unplaced = {att:0, kill:0, err:0};
  for(const ev of m.events){
    if(ev.teamId !== teamId || !ATTACK_STATS.has(ev.stat)) continue;
    if(set && ev.set !== set) continue;
    if(playerId && (ev.playerId ?? 'TEAM') !== playerId) continue;
    if(shot && (ev.shot || 'hit') !== shot) continue;
    if(play && ev.play !== play) continue;
    const c = ev.zone ? (grid[ev.zone] ??= {att:0, kill:0, err:0}) : unplaced;
    c.att++;
    if(ev.stat === 'kill') c.kill++;
    else if(ev.stat === 'attackErr') c.err++;
  }
  return {grid, unplaced};
}
const zoneHit = c => c && c.att ? (c.kill - c.err) / c.att : null;

/* ---------- formatting ---------- */
function pct3(v){ // volleyball convention: .333 / -.083 / 1.000
  if(v===null) return '—';
  const s = Math.abs(v).toFixed(3);
  return (v<0?'-':'') + (Math.abs(v)>=1 ? s : s.slice(1));
}
const dec = (v,n=2) => v===null ? '—' : v.toFixed(n);
/* Names are optional — most opponents only give you jersey numbers.
   pFull() is the "#7 Wes" / "#7" / "Wes" form used wherever a player
   is named on its own; pDash() is for tables that already have a # column. */
const jersey = p => String(p.number ?? '').trim();
const pFull  = p => [jersey(p) ? '#'+jersey(p) : '', (p.name||'').trim()].filter(Boolean).join(' ') || 'Unnamed';
const pDash  = p => (p.name||'').trim() ? esc(p.name) : '<span style="color:var(--dim)">—</span>';
/* name or nothing: opponents are usually numbers only, and a dash under every
   number reads as noise, not as "no name" */
const pName  = p => esc((p.name||'').trim());
const half = v => Number.isInteger(v) ? String(v) : v.toFixed(1);
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* Court diagram. Shading is a SEQUENTIAL single-hue ramp on attack volume
   (light -> dark, never a rainbow); every cell also prints its count, so the
   colour is redundant encoding and the chart still reads in greyscale. */
function courtHtml(cells, {detail=false}={}){
  const counts = ZONE_ORDER.map(z => cells[z]?.att ?? 0);
  const max = Math.max(1, ...counts);
  return `<div class="court">
    <div class="net">NET</div>
    <div class="zones">
      ${ZONE_ORDER.map(z => {
        const c = cells[z];
        const a = c && c.att ? 0.10 + 0.42 * (c.att / max) : 0;
        const hp = zoneHit(c);
        const tip = c && c.att
          ? `Zone ${z} — ${c.att} attack${c.att===1?'':'s'}, ${c.kill} kill${c.kill===1?'':'s'}, `
            + `${c.err} error${c.err===1?'':'s'}, hitting ${pct3(hp)}`
          : `Zone ${z} — no attacks`;
        return `<div class="zone" style="background:rgba(77,163,255,${a.toFixed(3)})" title="${esc(tip)}">
          <span class="zn">${z}</span>
          <span class="zc num">${c?.att ?? 0}</span>
          ${detail && c?.att ? `<span class="zd num">${c.kill}K · ${pct3(hp)}</span>` : ''}
        </div>`;
      }).join('')}
    </div>
  </div>`;
}

/* legend for the sequential ramp — a scale, not a category key.
   Suppressed entirely when nothing is located, since a ramp with no data
   behind it reads as though the court were populated. */
function courtScale(max){
  if(!max) return '';
  const steps = [0, .25, .5, .75, 1];
  return `<div class="cscale"><span>0</span>
    ${steps.map(s=>`<i style="background:rgba(77,163,255,${(s?0.10+0.42*s:0).toFixed(3)})"></i>`).join('')}
    <span>${max} attack${max===1?'':'s'}</span></div>`;
}

/* Shot chart: one line per located attack, from the hitter's take-off spot
   to where it landed. Colour = shot (hit / tip), line style = outcome.
   With `pick`, it is the input surface for the placement popup instead. */
function shotSvg(events, {pick=null}={}){
  const zl = ZONE_ORDER.map(z => {
    const [x, y] = ZONE_XY[z];
    return `<text class="zl" x="${x}" y="${y}">${z}</text>`;
  }).join('');

  const fromMarks = FROMS.map(([k, l]) => {
    const [x, y] = FROM_XY[k];
    return pick
      ? `<g class="from ${pick.from===k?'on':''}" data-from="${k}">
           <rect x="${x-12.5}" y="${y-5.5}" width="25" height="11" rx="5.5"/><text x="${x}" y="${y}">${l}</text></g>`
      : `<text class="sidel" x="${x}" y="${y-4}">${l.toUpperCase()}</text>`;
  }).join('');

  const tickCodes = pick
    ? (pick.from === 'M' ? MIDDLE_PLAYS : [])
    : [...new Set(events.filter(ev => ev.from === 'M' && ev.play).map(ev => ev.play))];
  const ticks = tickCodes.map(code => {
    const x = playX(code); if(x == null) return '';
    const on = pick && pick.play === code;
    return `<g class="ptick ${on ? 'on' : ''}" ${pick ? `data-pplay="${code}"` : ''}>
      ${pick ? `<rect x="${x-4.5}" y="-10" width="9" height="10" fill="transparent"/>` : ''}
      <circle cx="${x}" cy="${PLAY_Y}" r="1.3"/><text x="${x}" y="${PLAY_Y - 2.6}">${code}</text></g>`;
  }).join('');

  // misses first so kills draw on top of them
  const sorted = [...events].sort((a,b) => (a.stat==='kill') - (b.stat==='kill'));
  const marks = sorted.map(ev => {
    const pt = landing(ev); if(!pt) return '';
    const [x, y] = pt;
    const from = ev.from === 'M' && playX(ev.play) != null
      ? [playX(ev.play), PLAY_Y]             // a middle set starts at its own slot on the net
      : FROM_XY[ev.from];
    const tip = ev.shot === 'tip', kill = ev.stat === 'kill';
    // colour = take-off (power / middle / right side); back row and unknown are grey.
    // hit vs tip is carried by the end mark (circle / diamond) instead.
    const col = FROM_COLOR[ev.from] ?? 'var(--from-b)';
    const miss = kill ? '' : 'miss';
    const p = ev.playerId ? player(ev.playerId) : null;
    const title = [p ? pFull(p) : 'Team', STAT_LABEL[ev.stat], tip ? 'tip' : 'hit',
                   ev.from ? 'from ' + FROM_LABEL[ev.from].toLowerCase() : null, ev.play,
                   'zone ' + zoneAt(x, y), 'set ' + ev.set].filter(Boolean).join(' · ');
    // inline style: the .end CSS would otherwise beat SVG presentation attributes
    const paint = kill ? `fill:${col}` : `stroke:${col}`;
    const end = tip
      ? `<path class="end ${miss}" d="M${x} ${y-3}L${x+3} ${y}L${x} ${y+3}L${x-3} ${y}Z" style="${paint}"/>`
      : `<circle class="end ${miss}" cx="${x}" cy="${y}" r="2.1" style="${paint}"/>`;
    return `<g><title>${esc(title)}</title>
      ${from ? `<line class="mk ${miss}" x1="${from[0]}" y1="${from[1]}" x2="${x}" y2="${y}" stroke="${col}"/>` : ''}
      ${end}</g>`;
  }).join('');

  return `<svg class="shots" viewBox="-5 ${-THEIRS-2} ${COURT+10} ${COURT+THEIRS+7}" role="img"
      aria-label="Shot chart">
    <rect class="floor" x="0" y="${-THEIRS}" width="${COURT}" height="${THEIRS}"/>
    <line class="ln" x1="0" y1="${-LINE3}" x2="${COURT}" y2="${-LINE3}"/>
    <rect class="floor ${pick?'tapzone':''}" x="0" y="0" width="${COURT}" height="${COURT}" ${pick?'data-land':''}/>
    <line class="ln" x1="30" y1="0" x2="30" y2="${COURT}"/>
    <line class="ln" x1="60" y1="0" x2="60" y2="${COURT}"/>
    <line class="bound" x1="0" y1="${LINE3}" x2="${COURT}" y2="${LINE3}"/>
    <rect class="bound" x="0" y="0" width="${COURT}" height="${COURT}"/>
    <g pointer-events="none">${zl}</g>
    <line class="netl" x1="-3" y1="0" x2="${COURT+3}" y2="0"/>
    ${fromMarks}
    ${ticks}
    <g ${pick?'pointer-events="none"':''}>${marks}</g>
  </svg>`;
}

/* legend: names both encodings, so identity never rests on colour alone */
const FROM_COLOR = {L:'var(--from-l)', M:'var(--from-m)', R:'var(--from-r)', B:'var(--from-b)'};
function shotLegend(){
  const sw = (col, dash, shape) => `<svg viewBox="0 0 22 10">
    <line x1="1" y1="5" x2="15" y2="5" stroke="${col}" stroke-width="2" ${dash?'stroke-dasharray="3 2"':''}/>
    ${shape==='d' ? `<path d="M18 1.5L21.5 5L18 8.5L14.5 5Z" fill="${col}"/>`
      : shape==='c' ? `<circle cx="18" cy="5" r="3" fill="${col}"/>` : ''}</svg>`;
  return `<div class="slegend">
    <span>${sw('var(--from-l)', false)}Power</span>
    <span>${sw('var(--from-m)', false)}Middle</span>
    <span>${sw('var(--from-r)', false)}Right side</span>
    <span>${sw('var(--from-b)', false)}Back row</span>
  </div>
  <div class="slegend">
    <span>${sw('var(--muted)', false, 'c')}Hit</span>
    <span>${sw('var(--muted)', false, 'd')}Tip</span>
    <span>${sw('var(--muted)', false)}Solid = kill</span>
    <span>${sw('var(--muted)', true)}Dashed = not a kill</span>
  </div>`;
}

/* the located attacks a shot chart draws, under the usual placement filters */
function shotEvents(m, teamId, {playerId=null, shot=null, set=null, play=null, killsOnly=false}={}){
  return m.events.filter(ev =>
    ev.teamId === teamId && ATTACK_STATS.has(ev.stat) && landing(ev)
    && (!set || ev.set === set)
    && (!playerId || (ev.playerId ?? 'TEAM') === playerId)
    && (!shot || (ev.shot || 'hit') === shot)
    && (!play || ev.play === play)
    && (!killsOnly || ev.stat === 'kill'));
}

/* With `undoIds`, the toast carries an Undo for exactly those events — not
   "the last event", which may already be a later tap — and stays up longer. */
let toastTimer;
function toast(msg, undoIds=null){
  const el = document.getElementById('toast');
  el.innerHTML = `<span>${esc(msg)}</span>` + (undoIds ? `<button data-toastundo>Undo</button>` : '');
  el.classList.toggle('act', !!undoIds);
  el.classList.add('show');
  const b = el.querySelector('[data-toastundo]');
  if(b) b.onclick = () => {
    const m = current(); if(!m) return;
    const ids = new Set(undoIds);
    m.events = m.events.filter(ev => !ids.has(ev.id));
    save(); render(); toast('Undone');
  };
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), undoIds ? 4000 : 1500);
}

  const ui = S.ui;
  ui.set ??= m.sets.length;
  ui.set = Math.min(Math.max(1, ui.set), m.sets.length); // guard stale ui across matches
  ui.side ??= 'a';
  const teamId = ui.side === 'a' ? m.teamA : m.teamB;
  const t = team(teamId);
  const set = m.sets[ui.set-1] ?? m.sets[m.sets.length-1];

  const padBtns = t => STATS.filter(s=>s.tier===t).map(s=>`
    <button class="pbtn ${s.tone}" data-stat="${s.key}">

  const catBlocks = CATS.map(c=>`

        ${STATS.filter(s=>s.cat===c).map(s=>`
          <button class="sbtn ${s.tone}" data-stat="${s.key}">

      ${ev.from ? `<span class="zchip">${FROM_LABEL[ev.from].toLowerCase()}${ev.play ? ' ' + ev.play : ''}</span>` : ''}
      ${ev.zone ? `<span class="zchip">Z${ev.zone}</span>` : ''}

               <span class="hp ${mtdHit===null?'':mtdHit>=0?'pos':'neg'}"><b class="num">${pct3(mtdHit)}</b> hit%</span>
             </div>

      </div>

  ['E',   'Attack errors',            r=>r.attackErr],
  ['TA',  'Total attack attempts',    r=>attempts(r)],
  ['Hit%','Hitting efficiency (K−E)/TA', r=>pct3(hitPct(r)), '', r=>hitPct(r)],
  ['K%',  'Kill percentage K/TA',     r=>pct3(killPct(r))],
  ['SA',  'Service aces',             r=>r.ace, 'grp'],
  ['SE',  'Service errors',           r=>r.serveErr],
  ['TSA', 'Total serve attempts',     r=>serveTot(r)],
  ['RE',  'Reception errors',         r=>r.recErr, 'grp'],
  ['RTA', 'Total receptions',         r=>recTot(r)],
  ['Rec%','Reception success (RTA−RE)/RTA', r=>pct3(recPct(r))],
  ['Pass','Passer rating, 3-point scale', r=>dec(passRating(r))],
  ['A',   'Assists',                  r=>r.assist, 'grp'],
  ['BHE', 'Ball handling errors',     r=>r.setErr],
  ['BS',  'Block solos',              r=>r.blockSolo, 'grp'],
  ['BA',  'Block assists',            r=>r.blockAssist],

/* Where a team's attacks went. Sequential shading by volume; counts printed
   in every cell so it reads without colour. */
function placePanel(m, teamId, f){
  const t = team(teamId);
  const who  = S.ui['place_'+teamId] ?? '';
  const shot = S.ui.placeShot ?? '';
  /* set-type filter: offered once this team has a typed middle attack, and kept
     visible while active so an empty result can always be switched back */
  const play = S.ui.placePlay ?? '';
  const typed = m.events.some(ev => ev.teamId === teamId && ev.play);
  const filt = {...f, playerId: who||null, shot: shot||null, play: play||null};
  const {grid, unplaced} = placement(m, teamId, filt);

  const located = Object.values(grid).reduce((n,c)=>n+c.att, 0);
  if(!located && !unplaced.att && !play) return '';   // nothing to show yet

  const max = Math.max(0, ...ZONE_ORDER.map(z=>grid[z]?.att ?? 0));
  const best = ZONE_ORDER
    .map(z=>({z, ...(grid[z] ?? {att:0,kill:0,err:0})}))
    .sort((a,b)=>b.att-a.att)[0];
  const label = who
    ? (who==='TEAM' ? 'Team / unassigned' : pFull(player(who)))
    : 'All players';
  const killsOnly = !!S.ui.placeKills;
  const shots = shotEvents(m, teamId, {...filt, killsOnly});
  const noLine = shots.filter(ev => !ev.from).length;
  const mid = middlePlays(m, teamId, {...f, playerId: who||null, shot: shot||null}, play);

  return `
  <div class="panel">
    <div class="row" style="margin-bottom:11px">
      <h2 style="margin:0">${esc(t.name)} — attack placement</h2>
      <div class="spacer"></div>
      <select data-placeplayer="${teamId}">
        <option value="">All players</option>
        ${t.players.map(p=>`<option value="${p.id}" ${who===p.id?'selected':''}>${esc(pFull(p))}</option>`).join('')}
        <option value="TEAM" ${who==='TEAM'?'selected':''}>Team / unassigned</option>
      </select>
      <div class="fgroup"><span class="flabel">Shot</span>
        <div class="setpills" style="margin:0;grid-column:auto">
          ${[['','All'],...SHOTS].map(([k,l])=>`
            <button class="${shot===k?'on':''}" data-placeshot="${k}">${l}</button>`).join('')}
        </div>

          hitting position recorded — drawn as a landing mark only.</p>` : ''}
      </div>

        <h3>By zone</h3>

        ${located
          ? `<p>${located} located attack${located===1?'':'s'}.
               Most often <b>zone ${best.z}</b> — ${best.att} time${best.att===1?'':'s'},
               ${best.kill} kill${best.kill===1?'':'s'}, hitting ${pct3(zoneHit(best))}.</p>`
          : `<p>No attacks have a recorded location yet.</p>`}

/* Middle attacks by middle set (30 / 51 / 60). Counts every middle attack
   under the panel's filters, located or not, so an untyped or skipped swing is
   never dropped. Ignores the middle-set filter on purpose — it's the comparison
   across types — and highlights the selected row instead. Rows are the filter:
   tap one to show only that set, tap it again to clear. "Middle set" is always
   spelled out because "set" alone reads as Set 1 / Set 2 of the match. */
function middlePlays(m, teamId, {playerId=null, shot=null, set=null}={}, active=''){
  const rows = {};
  for(const ev of m.events){
    if(ev.teamId !== teamId || !ATTACK_STATS.has(ev.stat) || ev.from !== 'M') continue;
    if(set && ev.set !== set) continue;
    if(playerId && (ev.playerId ?? 'TEAM') !== playerId) continue;
    if(shot && (ev.shot || 'hit') !== shot) continue;
    const c = rows[ev.play || ''] ??= {att:0, kill:0, err:0};
    c.att++;
    if(ev.stat === 'kill') c.kill++;
    else if(ev.stat === 'attackErr') c.err++;
  }
  if(!MIDDLE_PLAYS.some(k => rows[k])) return '';   // nobody has tagged a type yet
  const line = (k, label) => rows[k] ? `<tr ${k ? `data-placeplay="${k===active ? '' : k}" title="${k===active ? 'Show all middle sets' : 'Show only middle set ' + k}"` : ''}
      class="${active && k===active ? 'sel' : ''}"><td>${label}</td><td class="num">${rows[k].att}</td>
    <td class="num">${rows[k].kill}</td><td class="num">${rows[k].err}</td>
    <td class="num ${zoneHit(rows[k])>=0?'pos':'neg'}">${pct3(zoneHit(rows[k]))}</td></tr>` : '';
  return `<h3 style="margin-top:12px">Middle sets <span class="fine" style="text-transform:none;letter-spacing:0">· tap a row to filter</span></h3>
    <div class="tw" style="max-width:300px;margin-bottom:10px"><table class="mini">
      <thead><tr><th style="width:auto">Middle set</th><th>Att</th><th>K</th><th>E</th><th>Hit%</th></tr></thead>
      <tbody>${MIDDLE_PLAYS.map(k => line(k, k)).join('')}${line('', '<span style="color:var(--dim)">no type</span>')}</tbody>
    </table></div>`;
}

/* On a phone the 22-column table hid the shot chart ~1,100px down; it starts
   folded there (the key numbers stay visible) and open on a desktop. Once
   someone toggles it, their choice wins on both. */
function fullBoxOpen(){
  const roomy = typeof matchMedia === 'function' ? matchMedia('(min-width:701px)').matches : true;
  return S.ui.fullBox ?? roomy;
}

function teamBox(m, teamId, f){
  const t = team(teamId);
  const agg = tally(m, {...f, teamId});
  const rows = [
    ...t.players.map(p=>({p, r: agg[p.id] ?? zero()})),
    ...(agg['TEAM:'+teamId] ? [{p:{number:'', name:'Team / unassigned', id:'TEAM'}, r: agg['TEAM:'+teamId]}] : [])
  ].filter(x => Object.values(x.r).some(v=>v>0) || x.p.id!=='TEAM');

  const tot = sumRows(rows.map(x=>x.r));
  const he = hitPct(tot);

  const body = rows.map(({p,r})=>`
    <tr>
      <td class="num">${esc(jersey(p))}</td>
      <td>${p.id==='TEAM' ? esc(p.name) : (pName(p) || (p.pos ? '' : pDash(p)))}${p.pos?` <span style="color:var(--dim);font-size:11px">${esc(p.pos)}</span>`:''}</td>
      ${COLS.map(c=>`<td class="num ${c[3]||''} ${cellTone(c,r)}">${c[2](r)}</td>`).join('')}
    </tr>`).join('');

  return `
  <div class="panel">
    <h2>${esc(t.name)}</h2>
    <div class="kpis">
      <div class="kpi"><div class="l">Hitting %</div>
        <div class="v ${he===null?'':he>=0?'pos':'neg'}">${pct3(he)}</div></div>
      <div class="kpi"><div class="l">Kills</div><div class="v">${tot.kill}</div></div>
      <div class="kpi"><div class="l">Attack Err</div><div class="v">${tot.attackErr}</div></div>
      <div class="kpi"><div class="l">Aces</div><div class="v">${tot.ace}</div></div>
      <div class="kpi"><div class="l">Total Blocks</div><div class="v">${half(blockTot(tot))}</div></div>
      <div class="kpi"><div class="l">Digs</div><div class="v">${tot.dig}</div></div>
      <div class="kpi"><div class="l">Pass Rating</div><div class="v">${dec(passRating(tot))}</div></div>
      <div class="kpi"><div class="l">Errors</div><div class="v">${errors(tot)}</div></div>
    </div>
    <details class="fullbox" ${fullBoxOpen() ? 'open' : ''}>
    <summary>Full box score</summary>
    <div class="tw"><table>
      <thead><tr>
        <th title="Jersey number">#</th><th title="Player">Player</th>
        ${COLS.map(c=>`<th class="${c[3]||''}" title="${esc(c[1])}">${c[0]}</th>`).join('')}
      </tr></thead>
      <tbody>
        ${body || `<tr><td colspan="${COLS.length+2}" style="text-align:center;color:var(--dim);padding:20px">No players</td></tr>`}
        <tr class="tot">
          <td></td><td>TOTAL</td>
          ${COLS.map(c=>`<td class="num ${c[3]||''} ${cellTone(c,tot)}">${c[2](tot)}</td>`).join('')}
        </tr>
      </tbody>
    </table></div>
    </details>
  </div>`;
}
function cellTone(c, r){
  if(c[0] !== 'Hit%') return '';
  const v = hitPct(r);
  return v===null ? '' : v>=0 ? 'pos' : 'neg';
}

/* ============================================================
   EVENT WIRING
   ============================================================ */
function wire(){
  const $$ = s => [...app.querySelectorAll(s)];
  const on = (sel, ev, fn) => $$(sel).forEach(el => el.addEventListener(ev, fn));
  const go = v => { view=v; document.querySelectorAll('nav button')
      .forEach(x=>x.classList.toggle('on', x.dataset.v===v)); render(); };

  on('[data-go]','click', e => go(e.currentTarget.dataset.go));

  /* --- match view --- */
  on('[data-side]','click', e => { S.ui.side = e.currentTarget.dataset.side; save(); render(); });
  on('[data-set]','click',  e => { S.ui.set = +e.currentTarget.dataset.set; save(); render(); });
  on('[data-sel]','click',  e => {
    const m = current(), tid = S.ui.side==='a' ? m.teamA : m.teamB;
    S.ui['sel_'+tid] = e.currentTarget.dataset.sel;
    save(); render();
  });
  on('[data-placeplayer]','change', e => {
    S.ui['place_'+e.target.dataset.placeplayer] = e.target.value; save(); render();
  });
  on('[data-placeshot]','click', e => { S.ui.placeShot = e.currentTarget.dataset.placeshot; save(); render(); });
  on('[data-placeplay]','click', e => { S.ui.placePlay = e.currentTarget.dataset.placeplay; save(); render(); });
  on('[data-placekills]','click', e => { S.ui.placeKills = e.currentTarget.dataset.placekills === '1'; save(); render(); });
  on('[data-placecsv]','click', exportPlacementCsv);
  on('[data-stat]','click', e => requestStat(e.currentTarget.dataset.stat));
  on('[data-undo]','click', undo);
  on('[data-edit]','click', e => openEdit(e.currentTarget.dataset.edit));
  // <details> resets on every re-render, so its open state has to be persisted
  on('details.more','toggle', e => { S.ui.more = e.target.open; save(); });
  on('details.place','toggle', e => { S.ui.court = e.target.open; save(); });
  on('details.fullbox','toggle', e => { S.ui.fullBox = e.target.open; save(); });
  const newSet = () => {
    const m = current();
    m.sets.push({a:0,b:0}); S.ui.set = m.sets.length; save(); render();
    toast('Set ' + m.sets.length + ' started');
  };
  on('[data-newset]','click', newSet);
  on('[data-setsel]','change', e => {
    if(e.target.value === 'new') return newSet();
    S.ui.set = +e.target.value; save(); render();
  });
  on('[data-pt]','click', e => {
    const [side, d] = e.currentTarget.dataset.pt.split(',');
    const m = current(), s = m.sets[S.ui.set-1];
    s[side] = Math.max(0, s[side] + (+d)); save(); render();
  });

  /* --- box score --- */
  on('[data-boxmatch]','change', e => {
    S.ui.boxMatch = e.target.value; S.ui.boxSet = 0; save(); render();
  });
  on('[data-boxset]','change', e => { S.ui.boxSet = +e.target.value; save(); render(); });
  on('[data-csv]','click', exportCsv);
  on('[data-boxteam]','click', e => { S.ui.boxTeam = e.currentTarget.dataset.boxteam; save(); render(); });

  /* --- teams --- */
  on('[data-addteam]','click', () => {
    const el = document.getElementById('newTeam');
    const name = el.value.trim(); if(!name) return el.focus();
    S.teams.push({id:uid(), name, players:[]}); save(); render(); toast('Team added');
  });
  on('[data-tname]','change', e => {
    team(e.target.dataset.tname).name = e.target.value.trim() || 'Unnamed'; save(); render();
  });
  on('[data-delteam]','click', e => {
    const id = e.currentTarget.dataset.delteam;
    const used = S.matches.some(m => m.teamA===id || m.teamB===id);
    if(used) return toast('Team is used by a match — delete the match first');
    if(!confirm('Delete "'+teamName(id)+'" and its roster?')) return;
    S.teams = S.teams.filter(t=>t.id!==id); save(); render();
  });
  on('[data-addplayer]','click', e => addPlayer(e.currentTarget.dataset.addplayer));
  on('[data-newname]','keydown', e => { if(e.key==='Enter') addPlayer(e.target.dataset.newname); });
  on('[data-newnum]','keydown',  e => { if(e.key==='Enter') addPlayer(e.target.dataset.newnum); });
  on('[data-pnum]','change',  e => { player(e.target.dataset.pnum).number = e.target.value.trim(); save(); });
  on('[data-pname]','change', e => { player(e.target.dataset.pname).name = e.target.value.trim(); save(); render(); });
  on('[data-ppos]','change',  e => { player(e.target.dataset.ppos).pos = e.target.value; save(); });
  on('[data-delplayer]','click', e => {
    const pid = e.currentTarget.dataset.delplayer;
    const stats = S.matches.reduce((n,m)=>n + m.events.filter(ev=>ev.playerId===pid).length, 0);
    const who = pFull(player(pid));
    // always ask: the button sits next to the position picker, so a stray tap is easy
    if(!confirm(stats
      ? `Remove ${who}? They have ${stats} recorded stat${stats===1?'':'s'}, which will be removed too.`
      : `Remove ${who} from the roster?`)) return;
    for(const t of S.teams) t.players = t.players.filter(p=>p.id!==pid);
    for(const m of S.matches) m.events = m.events.filter(ev=>ev.playerId!==pid);
    save(); render();
  });

  /* --- matches --- */
  on('[data-newmatch]','click', () => {
    const a = document.getElementById('mA').value, b = document.getElementById('mB').value;
    if(a===b) return toast('Pick two different teams');
    const m = {id:uid(), date:document.getElementById('mDate').value, teamA:a, teamB:b,
               sets:[{a:0,b:0}], events:[]};
    S.matches.push(m); S.activeMatch = m.id; S.ui = {set:1, side:'a'};
    save(); go('match'); toast('Match created');
  });
  on('[data-boxof]','click', e => {
    S.ui.boxMatch = e.currentTarget.dataset.boxof; S.ui.boxSet = 0; save(); go('box');
  });
  on('[data-open]','click', e => {
    S.activeMatch = e.currentTarget.dataset.open;
    S.ui = {set:1, side:'a', boxSet:0}; save(); go('match');
  });
  on('[data-delmatch]','click', e => {
    const id = e.currentTarget.dataset.delmatch;
    if(!confirm('Delete this match and all of its stats?' + (sync.live ? ' This deletes it for everyone on the shared data.' : ''))) return;
    S.matches = S.matches.filter(m=>m.id!==id);
    if(S.activeMatch===id) S.activeMatch = S.matches.at(-1)?.id ?? null;
    save(); render();
  });
  on('[data-export]','click', exportAll);
  on('[data-import]','click', () => document.getElementById('fileIn').click());
  const fi = document.getElementById('fileIn');
  if(fi) fi.onchange = ev => {
    const f = ev.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = () => {
      try{
        const d = JSON.parse(r.result);
        if(!Array.isArray(d.teams) || !Array.isArray(d.matches)) throw new Error('not a stats file');
        if(sync.live){
          if(!confirm("Add this file's teams and matches to the shared data? Nothing already there is removed.")) return;
          mergeImport(d); save(); render(); return toast('Added to shared data');
        }
        if(!confirm('Replace all current data with this file?')) return;
        S = Object.assign(blank(), d); save(); render(); toast('Imported');
      }catch(err){ alert('Could not import: ' + err.message); }
    };
    r.readAsText(f);
  };
  on('[data-signin]','click', signInFromForm);
  on('#sbPass','keydown', e => { if(e.key === 'Enter') signInFromForm(); });
  on('[data-signout]','click', signOut);
  on('[data-wipe]','click', async () => {
    if(!confirm(sync.live
      ? 'Erase ALL teams, matches and stats FOR EVERYONE on the shared data? This cannot be undone.'
      : 'Erase ALL teams, matches and stats? This cannot be undone.')) return;
    if(await confirmErase() !== 'erase') return;
    S = blank(); save(); render(); toast('Erased');
  });
}

function exportAll(){
  download('volleyball-stats-' + new Date().toISOString().slice(0,10) + '.json',
           JSON.stringify(S, null, 2), 'application/json');
}

/* The second of Erase everything's two confirmations. Two OK taps in a row is
   too easy to do by reflex — and signed in, it erases the shared data for
   everyone — so this step has to be typed, with a backup one tap away. */
function confirmErase(){
  return new Promise(resolve => {
    dialog = {resolve};
    sheet.innerHTML = `
      <div class="hd"><h2 class="neg">Erase everything?</h2>
        <button class="x" data-choice="cancel" aria-label="Cancel">×</button></div>
      <p class="psum" style="margin:0 0 10px">${sync.live
        ? '<b>This erases every team, match and stat for everyone on the shared data</b> — you and your assistants.'
        : 'This erases every team, match and stat on this device.'} It can't be undone.</p>
      <button class="btn" data-export-now style="width:100%;min-height:44px;margin-bottom:12px">Export a backup first</button>
      <label class="fine" for="eraseWord" style="display:block;margin-bottom:4px">Type ERASE to confirm</label>
      <input id="eraseWord" autocomplete="off" autocapitalize="characters" spellcheck="false"
        style="width:100%;min-height:44px;font-size:16px">
      <div class="ft">
        <button class="btn danger" data-choice="erase" disabled>Erase everything</button>
        <button class="btn primary" data-choice="cancel">Cancel</button>
      </div>`;
    modal.hidden = false;
    const word = sheet.querySelector('#eraseWord'), go = sheet.querySelector('[data-choice="erase"]');
    word.addEventListener('input', () => { go.disabled = word.value.trim().toUpperCase() !== 'ERASE'; });
    sheet.querySelector('[data-export-now]').onclick = exportAll;
    setTimeout(() => word.focus(), 50);
  });
}

function addPlayer(tid){
  const t = team(tid);
  const numEl  = app.querySelector(`[data-newnum="${tid}"]`);
  const nameEl = app.querySelector(`[data-newname="${tid}"]`);
  const posEl  = app.querySelector(`[data-newpos="${tid}"]`);
  const name = nameEl.value.trim();
  const nums = numEl.value.split(/[\s,;/]+/).map(s=>s.trim()).filter(Boolean);

  // Either a number or a name is enough. Several numbers at once only
  // makes sense when there's no name to attach, so a name forces one row.
  if(!nums.length && !name) return numEl.focus();
  const rows = (nums.length && !name) ? nums.map(n=>({number:n, name:''}))
             : [{number:nums[0] ?? '', name}];

  for(const r of rows) t.players.push({id:uid(), number:r.number, name:r.name, pos:posEl.value});
  save(); render();
  app.querySelector(`[data-newnum="${tid}"]`)?.focus();
  if(rows.length > 1) toast(rows.length + ' players added');
}

function selection(){
  const m = current(); if(!m) return null;
  const teamId = S.ui.side==='a' ? m.teamA : m.teamB;
  return {m, teamId, sel: S.ui['sel_'+teamId]};
}

/* Every button and shortcut comes through here: attacks open the placement
   popup, everything else records straight away. */
function requestStat(stat){
  const s = selection(); if(!s) return;
  if(!s.sel) return toast('Select a player first');
  if(ATTACK_STATS.has(stat)) openPlace(stat, s.sel);
  else addStat(stat);
}

/* loc = {shot, from, play, x, y, dig} from the popup; x/y absent when skipped.
   dig = the defender who dug a kept-in-play attack — logged as their own Dig. */
function addStat(stat, loc=null){
  const s = selection(); if(!s) return;
  const {m, teamId, sel} = s;
  if(!sel) return toast('Select a player first');

  const ev = {id:uid(), set:S.ui.set, teamId,
              playerId: sel==='TEAM' ? null : sel, stat, dev: DEVICE};
  let note = '';
  if(ATTACK_STATS.has(stat)){
    ev.shot = loc?.shot || 'hit';
    if(loc?.from) ev.from = loc.from;
    if(loc?.play && ev.from === 'M') ev.play = loc.play;
    if(loc?.x != null){
      ev.x = loc.x; ev.y = loc.y; ev.zone = zoneAt(loc.x, loc.y);
      note = ` → zone ${ev.zone}`;
    }
    note += ` (${ev.play ? ev.play + ' ' : ''}${SHOT_LABEL[ev.shot].toLowerCase()})`;
  }
  m.events.push(ev);
  const ids = [ev.id];
  if(loc?.dig && stat === 'attack0'){
    const other = teamId === m.teamA ? m.teamB : m.teamA;
    const d = {id:uid(), set:S.ui.set, teamId: other,
               playerId: loc.dig === 'TEAM' ? null : loc.dig, stat:'dig', dev: DEVICE};
    m.events.push(d); ids.push(d.id);
    const dp = d.playerId ? player(d.playerId) : null;
    note += ` · dug by ${dp ? pFull(dp) : 'team'}`;
  }
  save(); render();
  toast(STAT_LABEL[stat] + note, ids);
}

/* ---------- placement popup ----------
   Opens on every attack. The hitter's take-off spot is remembered per player
   (an outside hitter keeps swinging from the left), so the usual case is one
   tap on the landing spot. Skip still records the attack, just unlocated. */
let pop = null;   // {stat, sel, shot, from, play, dig} while the popup is open
const modal = document.getElementById('placeModal');
const sheet = document.getElementById('placeSheet');

function openPlace(stat, sel){
  const p = sel === 'TEAM' ? null : player(sel);
  pop = {stat, sel, shot:'hit', play:null, dig:null,
         from: S.ui['from_'+sel] ?? FROM_BY_POS[p?.pos] ?? null};
  renderPop();
  modal.hidden = false;
}
function closePlace(){ pop = null; modal.hidden = true; }
/* a set type only means something from the middle, so leaving it drops the type */
function setFrom(f){ pop.from = f; if(f !== 'M') pop.play = null; }

/* "Dug by": an attack kept in play was usually dug, by the OTHER team. Logging
   it here saves switching team tabs and picking the digger mid-rally. Pick it
   before tapping the landing spot, which records and closes. */
function digRow(){
  const m = current();
  const other = team(selection().teamId === m.teamA ? m.teamB : m.teamA);
  const chip = (id, label) => `<button class="${pop.dig===id?'on':''}" data-pdig="${id}">${label}</button>`;
  return `<div class="digrow">
    <span class="fine">Dug by <span style="font-weight:600">(optional)</span></span>

}

function renderPop(){
  const p = pop.sel === 'TEAM' ? null : player(pop.sel);
  const st = STATS.find(s => s.key === pop.stat);
  sheet.innerHTML = `
    <div class="hd">
      <h2><span class="${st.tone==='good'?'pos':st.tone==='bad'?'neg':''}">${st.label}</span>

      </div>

        /* same row as Hit/Tip, so the tallest popup (middle + dug by) still fits a phone */
        ? `<span class="flabel">Middle set</span><div class="shotsel" title="Middle set (optional)">
            ${MIDDLE_PLAYS.map(k => `<button class="${pop.play===k?'on':''}" data-pplay="${k}">${k}</button>`).join('')}
          </div>`

modal.addEventListener('click', e => {
  if(dialog){
    const c = e.target.closest('[data-choice]');
    return c && closeDialog(c.dataset.choice);
  }
  if(editing){
    if(e.target === modal) return closeEdit();
    const t = e.target.closest('[data-eplayer],[data-estat],[data-edelete],[data-eclose]');
    return t && editEvent(t);
  }
  if(!pop) return;
  if(e.target === modal) return closePlace();          // tap outside the sheet
  const t = e.target.closest('[data-pshot],[data-pplay],[data-pdig],[data-from],[data-land],[data-pskip],[data-pclose]');
  if(!t) return;
  if(t.dataset.pclose !== undefined) return closePlace();
  if(t.dataset.pshot){ pop.shot = t.dataset.pshot; return renderPop(); }
  if(t.dataset.pdig){ pop.dig = pop.dig === t.dataset.pdig ? null : t.dataset.pdig; return renderPop(); }
  if(t.dataset.pplay){ pop.play = pop.play === t.dataset.pplay ? null : t.dataset.pplay; return renderPop(); }
  if(t.dataset.from){ setFrom(pop.from === t.dataset.from ? null : t.dataset.from); return renderPop(); }
  const {stat, sel, shot, from, play, dig} = pop;
  const loc = {shot, from, play, dig};
  if(t.dataset.land !== undefined){
    const svg = t.ownerSVGElement;
    const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
    const q = pt.matrixTransform(svg.getScreenCTM().inverse());
    const clamp = v => Math.round(Math.min(COURT, Math.max(0, v)) * 10) / 10;
    loc.x = clamp(q.x); loc.y = clamp(q.y);
  }
  if(from) S.ui['from_'+sel] = from;
  closePlace();
  addStat(stat, loc);
});

/* ---------- edit sheet ----------
   Any recent stat can be re-assigned to another player, changed to another
   stat, or deleted. Changes apply as they're tapped. Moving an attack to a
   non-attack stat drops its placement, which only means anything on an attack. */
let editing = null;   // {id, confirmDelete} while the edit sheet is open

function openEdit(id){ editing = {id, confirmDelete:false}; renderEdit(); modal.hidden = false; }
function closeEdit(){ editing = null; modal.hidden = true; }

function renderEdit(){
  const m = current(), ev = m?.events.find(e => e.id === editing.id);
  if(!ev) return closeEdit();
  const t = team(ev.teamId);
  const pid = ev.playerId ?? 'TEAM';
  const chip = (id, label) => `<button class="${pid===id?'on':''}" data-eplayer="${id}">${label}</button>`;
  sheet.innerHTML = `
    <div class="hd">
      <h2>Edit stat <span class="fine">· ${esc(t.name)} · set ${ev.set}</span></h2>
      <button class="x" data-eclose aria-label="Close">×</button>
    </div>
    <span class="fine" style="display:block;margin-bottom:4px">Player</span>
    <div class="digs" style="margin-bottom:10px">
      ${t.players.map(p => chip(p.id, esc(jersey(p) ? '#'+jersey(p) : pFull(p)))).join('')}
      ${chip('TEAM', 'Team')}
    </div>
    <span class="fine" style="display:block;margin-bottom:4px">Stat</span>
    <div class="pgrid sm">
      ${STATS.map(s => `<button class="pbtn ${s.tone} ${ev.stat===s.key?'cur':''}" data-estat="${s.key}">${s.short}</button>`).join('')}
    </div>
    <div class="ft">
      <button class="btn danger" data-edelete>${editing.confirmDelete ? 'Tap again to delete' : 'Delete'}</button>
      <button class="btn primary" data-eclose>Done</button>
    </div>`;
}

function editEvent(t){
  const m = current(), ev = m?.events.find(e => e.id === editing.id);
  if(!ev) return closeEdit();
  if(t.dataset.eclose !== undefined) return closeEdit();
  if(t.dataset.edelete !== undefined){
    if(!editing.confirmDelete){ editing.confirmDelete = true; return renderEdit(); }
    m.events = m.events.filter(e => e.id !== ev.id);
    save(); render(); closeEdit(); return toast('Deleted ' + STAT_LABEL[ev.stat]);
  }
  editing.confirmDelete = false;
  if(t.dataset.eplayer) ev.playerId = t.dataset.eplayer === 'TEAM' ? null : t.dataset.eplayer;
  if(t.dataset.estat){
    ev.stat = t.dataset.estat;
    if(!ATTACK_STATS.has(ev.stat)) for(const k of ['shot','from','play','x','y','zone']) delete ev[k];
    else ev.shot ??= 'hit';
  }
  save(); render(); renderEdit();
}

/* Takes back this device's own most recent stat — never one someone else
   recorded on another phone, even if theirs arrived later. */
function undo(){
  const m = current(); if(!m) return;
  const i = m.events.findLastIndex(ev => !ev.dev || ev.dev === DEVICE);
  if(i < 0) return toast('Nothing of yours to undo');
  const [ev] = m.events.splice(i, 1);
  save(); render();
  toast('Undid ' + STAT_LABEL[ev.stat]);
}

/* ---------- keyboard ---------- */
document.addEventListener('keydown', e => {
  if(dialog){ if(e.key === 'Escape') closeDialog('cancel'); return; }
  if(editing){ if(e.key === 'Escape') closeEdit(); return; }
  if(pop){                       // popup open: only its own keys, never a new stat
    const k = e.key.toLowerCase();
    if(k === 'escape'){ e.preventDefault(); return closePlace(); }
    if(k === 'h' || k === 't'){ pop.shot = k === 't' ? 'tip' : 'hit'; renderPop(); }
    const f = {p:'L', l:'L', m:'M', r:'R', b:'B'}[k];   // p = power
    if(f){ setFrom(f); renderPop(); }
    const play = pop.from === 'M' && MIDDLE_PLAYS.find(p => p[0] === k);
    if(play){ pop.play = pop.play === play ? null : play; renderPop(); }
    return;
  }
  if(view !== 'match') return;
  if(e.metaKey || e.ctrlKey || e.altKey) return;
  const tag = document.activeElement?.tagName;
  if(tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;

  const k = e.key.toLowerCase();
  if(k === 'z'){ e.preventDefault(); return undo(); }
  if(STAT_BY_KB[k]){ e.preventDefault(); requestStat(STAT_BY_KB[k]); }
});

/* ---------- export helpers ---------- */
function download(filename, text, type){
  const url = URL.createObjectURL(new Blob([text], {type}));
  const a = Object.assign(document.createElement('a'), {href:url, download:filename});
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

/* Long format — one row per player × shot × zone. Easier to pivot than a

function exportPlacementCsv(){
