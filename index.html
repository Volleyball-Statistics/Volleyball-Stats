/* ============================================================
   SHARED DATA (optional) — live sync through Supabase
   ============================================================
   Off until someone signs in. Every device keeps its full copy in localStorage
   and keeps working offline; Supabase holds one row per team / player / match /
   stat in `records`, and every signed-in device mirrors it.

   How changes move:
   - `base` remembers a hash of each record as the server last had it. Any
     record whose hash now differs is a local change still to upload, so
     taps made offline are simply uploaded on reconnect — no separate queue.
   - A record that's gone locally but still in `base` is uploaded as a
     tombstone (deleted = true), so other devices remove it too.
   - Incoming changes (live, or caught up on reconnect) are applied to S unless
     this device has its own un-uploaded change to that record, in which case
     ours is about to land and wins. Last write wins per record; stats are
     separate records, so two people recording at once never collide.
   UI state (S.ui, which match you're recording) stays on the device.        */
const SB = (() => {
  /* local test override, set from the console only:
     localStorage.setItem('vbstats.sbdev', JSON.stringify({url, key})) */
  try{
    const o = JSON.parse(localStorage.getItem('vbstats.sbdev') || 'null');
    if(o?.url && o?.key) return o;
  }catch(e){}
  // The publishable key is public by design: it grants nothing without a
  // signed-in account that's on the team's list (see supabase/schema.sql).
  return {url:'https://cqjquktoczapangtxayx.supabase.co',
          key:'sb_publishable_a6ZPD2t3lumqbk5m-QAwGg_b_mIgSfZ'};
})();
const SYNC_KEY = 'vbstats.sync.v1', AUTH_KEY = 'vbstats.auth';
const KIND_ORDER = {team:0, player:1, match:2, event:3};

const sync = {live:false, connected:false, status:'off', email:null, pending:0, error:null};
let sb = null, channel = null, base = {}, since = null, orphans = [];

function loadSync(){
  try{ const o = JSON.parse(localStorage.getItem(SYNC_KEY) || '{}'); base = o.base || {}; since = o.since || null; }
  catch(e){ base = {}; since = null; }
}
function saveSync(){ try{ localStorage.setItem(SYNC_KEY, JSON.stringify({base, since})); }catch(e){} }

/* stable JSON (sorted keys) so the same record always hashes the same */
const canon = v => v === null || typeof v !== 'object' ? JSON.stringify(v ?? null)
  : Array.isArray(v) ? '[' + v.map(canon).join(',') + ']'
  : '{' + Object.keys(v).filter(k => v[k] !== undefined).sort()
      .map(k => JSON.stringify(k) + ':' + canon(v[k])).join(',') + '}';
function hash(str){
  let h = 0x811c9dc5;
  for(let i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193); }
  return (h >>> 0).toString(36) + '.' + str.length.toString(36);
}
const hashOf = data => hash(canon(data));

/* S -> one record per thing */
function toRecords(){
  const out = new Map(), put = (kind, id, data) => out.set(kind + ':' + id, {kind, id, data});
  for(const t of S.teams){
    put('team', t.id, {name: t.name, c: t.c});
    for(const {id, ...p} of t.players) put('player', id, {...p, teamId: t.id});
  }
  for(const {id, events, ...m} of S.matches){
    put('match', id, m);
    for(const {id: eid, ...e} of events) put('event', eid, {...e, matchId: id});
  }
  return out;
}

/* records -> S */
const stampOrder = k => (a, b) => (a[k] ?? 0) - (b[k] ?? 0) || (a.id < b.id ? -1 : a.id > b.id ? 1 : 0);
function placeSorted(arr, obj, k){
  const i = arr.findIndex(x => stampOrder(k)(obj, x) < 0);
  i < 0 ? arr.push(obj) : arr.splice(i, 0, obj);
}
function replaceFields(obj, data, keep){
  for(const k of Object.keys(obj)) if(!keep.includes(k) && !(k in data)) delete obj[k];
  Object.assign(obj, data);
}
/* returns false when it can't be placed yet (its team / match hasn't arrived) */
function applyRecord({kind, id, data, deleted}){
  if(kind === 'team'){
    const i = S.teams.findIndex(t => t.id === id);
    if(deleted){ if(i >= 0) S.teams.splice(i, 1); }
    else if(i >= 0) replaceFields(S.teams[i], data, ['id', 'players']);
    else placeSorted(S.teams, {id, ...data, players: []}, 'c');
    return true;
  }
  if(kind === 'player'){
    const {teamId, ...p} = data;
    for(const t of S.teams){
      const j = t.players.findIndex(x => x.id === id);
      if(j < 0) continue;
      if(deleted || t.id !== teamId) t.players.splice(j, 1);
      else { replaceFields(t.players[j], p, ['id']); return true; }
    }
    if(deleted) return true;
    const t = team(teamId); if(!t) return false;
    placeSorted(t.players, {id, ...p}, 'c');
    return true;
  }
  if(kind === 'match'){
    const i = S.matches.findIndex(m => m.id === id);
    if(deleted){ if(i >= 0) S.matches.splice(i, 1); }
    else if(i >= 0) replaceFields(S.matches[i], data, ['id', 'events']);
    else placeSorted(S.matches, {id, ...data, events: []}, 'c');
    return true;
  }
  if(kind === 'event'){
    const {matchId, ...e} = data;
    for(const m of S.matches){
      const j = m.events.findIndex(x => x.id === id);
      if(j < 0) continue;
      if(deleted || m.id !== matchId) m.events.splice(j, 1);
      else { replaceFields(m.events[j], e, ['id']); return true; }
    }
    if(deleted) return true;
    const m = match(matchId); if(!m) return false;
    placeSorted(m.events, {id, ...e}, 't');
    return true;
  }
  return true;
}

function applyBatch(rows){
  const cur = toRecords();
  const queue = [...orphans, ...rows].sort((a, b) => KIND_ORDER[a.kind] - KIND_ORDER[b.kind]);
  orphans = [];
  let changed = false;
  for(const r of queue){
    if(r.updated_at && (!since || r.updated_at > since)) since = r.updated_at;
    const k = r.kind + ':' + r.id;
    const local = cur.get(k), lh = local ? hashOf(local.data) : undefined;
    const rh = r.deleted ? undefined : hashOf(r.data);
    if(lh === rh){ rh ? base[k] = rh : delete base[k]; continue; }   // already the same here
    if(lh !== base[k]) continue;         // our own change is still uploading; it wins
    if(!applyRecord(r)){ orphans.push(r); continue; }
    rh ? base[k] = rh : delete base[k];
    changed = true;
  }
  saveSync();
  if(changed){
    if(S.activeMatch && !match(S.activeMatch)) S.activeMatch = S.matches.at(-1)?.id ?? null;
    localStorage.setItem(KEY, JSON.stringify(S));
    renderSoon();
  }
}

/* local changes not yet on the server, parents before children */
function diff(){
  const cur = toRecords(), rows = [];
  for(const [k, r] of cur){ const h = hashOf(r.data); if(base[k] !== h) rows.push({...r, deleted: false, h}); }
  for(const k of Object.keys(base)) if(!cur.has(k)){
    const i = k.indexOf(':');
    rows.push({kind: k.slice(0, i), id: k.slice(i + 1), data: {}, deleted: true});
  }
  return rows.sort((a, b) => KIND_ORDER[a.kind] - KIND_ORDER[b.kind]);
}

let pushTimer = null, pushing = false, pushAgain = false, retryTimer = null;
function schedulePush(){
  if(!sync.live) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(push, 400);
}
async function push(){
  if(!sync.live) return;
  if(pushing){ pushAgain = true; return; }
  pushing = true; clearTimeout(retryTimer);
  try{
    do{
      pushAgain = false;
      const rows = diff();
      sync.pending = rows.length;
      if(!rows.length) break;
      if(!navigator.onLine){ setStatus('offline'); return; }
      setStatus('pending');
      for(let i = 0; i < rows.length; i += 500){
        const chunk = rows.slice(i, i + 500);
        const {error} = await sb.from('records')
          .upsert(chunk.map(({h, ...row}) => row), {onConflict: 'kind,id'});
        if(error) throw error;
        for(const row of chunk){
          const k = row.kind + ':' + row.id;
          row.deleted ? delete base[k] : base[k] = row.h;
        }
        saveSync();
      }
    }while(pushAgain);
    sync.pending = diff().length;
    setStatus(sync.pending ? 'pending' : 'synced');
  }catch(e){
    console.warn('sync upload failed', e);
    sync.connected = false;
    setStatus(navigator.onLine ? 'error' : 'offline', e.message);
    retryTimer = setTimeout(connect, 10000);
  }finally{ pushing = false; }
}

async function pullSince(){
  const all = [];
  for(let from = 0; ; from += 1000){
    let q = sb.from('records').select('kind,id,data,deleted,updated_at')
      .order('updated_at').order('kind').order('id').range(from, from + 999);
    if(since) q = q.gte('updated_at', since);
    const {data, error} = await q;
    if(error) throw error;
    all.push(...data);
    if(data.length < 1000) return all;
  }
}

/* live updates arrive one row at a time; apply them in small batches */
let liveBuf = [], liveTimer = null;
function subscribe(){
  if(channel) sb.removeChannel(channel);
  channel = sb.channel('records-live')
    .on('postgres_changes', {event: '*', schema: 'public', table: 'records'}, p => {
      if(!p.new?.kind) return;
      liveBuf.push(p.new);
      clearTimeout(liveTimer);
      liveTimer = setTimeout(() => { const rows = liveBuf; liveBuf = []; applyBatch(rows); }, 150);
    })
    .subscribe(status => {
      if(status === 'SUBSCRIBED') catchUp();
      else if(status === 'CHANNEL_ERROR' || status === 'TIMED_OUT'){
        sync.connected = false; setStatus(navigator.onLine ? 'error' : 'offline');
      }
    });
}
/* (Re)establish contact: still on the list? -> fetch what changed -> listen
   live -> upload what's waiting. Any failure retries every 10 s, and again as
   soon as the device comes back online or the app is brought to the front. */
let connecting = false;
async function connect(){
  if(!sync.live || connecting) return;
  connecting = true; clearTimeout(retryTimer);
  try{
    sync.pending = diff().length;
    setStatus('connecting');
    const {data: member, error} = await sb.rpc('is_member');
    if(error) throw error;
    if(!member) return removedFromList();
    applyBatch(await pullSince());
    sync.connected = true;
    subscribe();
    await push();
  }catch(e){
    console.warn('sync connect failed', e);
    sync.connected = false;
    setStatus(navigator.onLine ? 'error' : 'offline', e.message);
    retryTimer = setTimeout(connect, 10000);
  }finally{ connecting = false; }
}
async function catchUp(){
  if(!sync.live) return;
  if(!sync.connected) return connect();
  try{ applyBatch(await pullSince()); await push(); }
  catch(e){ console.warn('sync catch-up failed', e); sync.connected = false; connect(); }
}
addEventListener('online', catchUp);
addEventListener('offline', () => sync.live && setStatus('offline'));
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') catchUp(); });

function client(){
  if(!window.supabase) throw new Error('The sync library did not load.');
  return sb ??= window.supabase.createClient(SB.url, SB.key, {
    auth: {persistSession: true, autoRefreshToken: true, detectSessionInUrl: false, storageKey: AUTH_KEY}});
}

async function startSync(session){
  sync.email = session.user.email; sync.error = null;
  setStatus('connecting');
  const {data: member, error} = await sb.rpc('is_member');
  if(error) throw error;
  if(!member){
    await sb.auth.signOut().catch(() => {});
    sync.error = `${sync.email} isn't on this team's list. Ask the owner to add it.`;
    sync.email = null; setStatus('off'); return render();
  }
  loadSync();
  const firstTime = !since && !Object.keys(base).length;
  const rows = await pullSince();
  if(firstTime && (S.teams.length || S.matches.length)){
    const choice = await chooseFirstSync(rows.filter(r => !r.deleted).length);
    if(choice === 'cancel'){ await sb.auth.signOut().catch(() => {}); sync.email = null; setStatus('off'); return render(); }
    if(choice === 'discard'){ S.teams = []; S.matches = []; S.activeMatch = null; }
  }
  ensureStamps();
  sync.live = true;
  applyBatch(rows);
  render();
  await connect();
}

/* On launch: a saved sign-in counts straight away, even with no signal at the
   gym — taps are kept as waiting changes and connect() keeps trying. */
async function resumeSync(){
  if(!localStorage.getItem(AUTH_KEY)) return;   // never signed in here: stay fully local
  try{
    const {data} = await client().auth.getSession();   // read from this device, no network
    if(!data.session) return;
    sync.email = data.session.user.email;
    loadSync();
    sync.live = true;
    sync.pending = diff().length;
    render();
    connect();
  }catch(e){ console.warn('sync resume failed', e); setStatus(navigator.onLine ? 'error' : 'offline', e.message); }
}

/* the owner took this email off the list: stop, and don't keep their copy */
async function removedFromList(){
  sync.live = false; sync.connected = false;
  if(channel){ sb.removeChannel(channel); channel = null; }
  await sb.auth.signOut().catch(() => {});
  base = {}; since = null; orphans = []; localStorage.removeItem(SYNC_KEY);
  S.teams = []; S.matches = []; S.activeMatch = null;
  localStorage.setItem(KEY, JSON.stringify(S));
  sync.error = `${sync.email} is no longer on this team's list, so this device's copy was removed.`;
  sync.email = null; setStatus('off'); render();
}

async function signInFromForm(){
  const email = app.querySelector('#sbEmail')?.value.trim().toLowerCase();
  const password = app.querySelector('#sbPass')?.value;
  if(!email || !password) return toast('Enter your email and password');
  sync.error = null; setStatus('connecting'); render();
  try{
    const {data, error} = await client().auth.signInWithPassword({email, password});
    if(error) throw error;
    await startSync(data.session);
  }catch(e){
    sync.error = /invalid login/i.test(e.message) ? 'Wrong email or password.' : e.message;
    sync.email = null; setStatus('off'); render();
  }
}

async function signOut(){
  const waiting = sync.live ? diff().length : 0;
  if(!confirm(waiting
      ? `${waiting} change${waiting === 1 ? '' : 's'} haven't uploaded yet and will be lost. Sign out anyway?`
      : "Sign out? This device's copy of the shared data is cleared; everything stays in the shared data.")) return;
  sync.live = false; sync.connected = false; clearTimeout(retryTimer);
  if(channel){ sb.removeChannel(channel); channel = null; }
  await sb?.auth.signOut().catch(() => {});
  base = {}; since = null; orphans = []; localStorage.removeItem(SYNC_KEY);
  S.teams = []; S.matches = []; S.activeMatch = null;
  localStorage.setItem(KEY, JSON.stringify(S));
  sync.email = null; setStatus('off'); render(); toast('Signed out');
}

/* first sign-in on a device that already has data: ask what to do with it */
let dialog = null;
function chooseFirstSync(sharedCount){
  return new Promise(resolve => {
    dialog = {resolve};
    const nm = S.matches.length, nt = S.teams.length;
    sheet.innerHTML = `
      <div class="hd"><h2>This device already has data</h2></div>
      <p class="psum" style="margin:0 0 10px">${nm} match${nm === 1 ? '' : 'es'} and ${nt} team${nt === 1 ? '' : 's'}
        are saved on this device only. The shared data has ${sharedCount} record${sharedCount === 1 ? '' : 's'}.</p>
      <div class="list">
        <button class="btn primary" data-choice="upload" style="min-height:44px">Add this device's data to the shared data</button>
        <button class="btn" data-choice="discard" style="min-height:44px">Use only the shared data (clears this device's copy)</button>
        <button class="btn" data-choice="cancel" style="min-height:44px">Cancel — don't sign in</button>
      </div>
      <div class="hint">Test or practice data? Choose "Use only the shared data" so it doesn't reach your assistants.</div>`;
    modal.hidden = false;
  });
}
function closeDialog(choice){
  const d = dialog; dialog = null; modal.hidden = true; d?.resolve(choice);
}

function setStatus(status, err){
  sync.status = status;
  if(err) sync.error = err;
  const pill = document.getElementById('syncpill');
  if(pill){
    pill.hidden = status === 'off';
    pill.className = 'syncpill ' + status;
    pill.textContent = statusText();
  }
  const line = app.querySelector('[data-syncline]');
  if(line) line.textContent = statusText();
}
function statusText(){
  const n = sync.pending, w = `${n} change${n === 1 ? '' : 's'} waiting`;
  return ({connecting: n ? `Connecting · ${w}` : 'Connecting…',
           synced: 'Synced',
           pending: n ? `Uploading ${n} change${n === 1 ? '' : 's'}…` : 'Synced',
           offline: n ? `Offline · ${w}` : 'Offline',
           error: n ? `Can't reach server · ${w}` : "Can't reach server — retrying",
           off: ''})[sync.status] ?? '';
}
document.getElementById('syncpill').onclick = () => {
  view = 'matches';
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x.dataset.v === 'matches'));
  render();
};

/* never re-render under someone's cursor: a live update while they type a
   player name would wipe the field. Catch up when they leave it. */
let renderWaiting = false;
function renderSoon(){
  const a = document.activeElement;
  if(a && app.contains(a) && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)){
    if(!renderWaiting){ renderWaiting = true; a.addEventListener('blur', () => { renderWaiting = false; render(); }, {once: true}); }
    return;
  }
  render();
}

/* Import while signed in: add, never remove — a file must not be able to
   wipe the shared data for everyone. */
function mergeImport(d){
  for(const t of d.teams){
    const have = team(t.id);
    if(!have){ S.teams.push(t); continue; }
    for(const p of t.players) if(!have.players.some(x => x.id === p.id)) have.players.push(p);
  }
  for(const m of d.matches){
    const have = match(m.id);
    if(!have){ S.matches.push(m); continue; }
    for(const ev of m.events) if(!have.events.some(x => x.id === ev.id)) have.events.push(ev);
  }
}

function sharedPanel(){
  if(sync.live || sync.status === 'connecting' && sync.email){
    return `<div class="panel">
      <h2>Shared data</h2>
      <div class="row">
        <div><div class="ttl" style="font-weight:700">Signed in as ${esc(sync.email)}</div>
          <div class="sub" style="color:var(--dim);font-size:12px" data-syncline>${esc(statusText())}</div></div>
        <div class="spacer"></div>
        <button class="btn" data-signout>Sign out</button>
      </div>
      <div class="hint">Teams, matches and stats sync live with everyone on the team's list, and keep
        working offline — changes upload when the connection is back. Filters, and which match
        you're recording, stay on this device.</div>
    </div>`;
  }
  return `<div class="panel">
    <h2>Shared data</h2>
    <div class="row">
      <input type="email" id="sbEmail" placeholder="Email" autocomplete="username" autocapitalize="none"
        spellcheck="false" style="flex:1;min-width:180px">
      <input type="password" id="sbPass" placeholder="Password" autocomplete="current-password" style="flex:1;min-width:150px">
      <button class="btn primary" data-signin ${sync.status === 'connecting' ? 'disabled' : ''}>
        ${sync.status === 'connecting' ? 'Signing in…' : 'Sign in'}</button>
    </div>
    ${sync.error ? `<div class="hint" style="color:var(--bad)">${esc(sync.error)}</div>` : ''}
    <div class="hint">Optional. Sign in to share teams, matches and stats live with the rest of the
      coaching staff. Only accounts the owner has created can sign in. Without signing in,
      everything stays on this device.</div>
  </div>`;
}

/* ---------- offline support ----------
   Service workers only register from a secure context, so this is a no-op
   when the file is opened directly from disk (file://) — which is exactly
   how it still works on the Mac. On the hosted copy it caches the app so
   the phone runs with no network. */
if('serviceWorker' in navigator &&
   (location.protocol === 'https:' || ['localhost','127.0.0.1'].includes(location.hostname))){
  const hadController = !!navigator.serviceWorker.controller;
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    // only reload for an *update*, not the very first install
    if(hadController && !reloading){ reloading = true; location.reload(); }
  });
  addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}

/* ---------- light / dark ----------
   Follows the phone's setting until someone taps the toggle; after that their
   pick sticks on this device (it's not part of the shared data). */
const THEME_KEY = 'vbstats.theme';
const prefersLight = matchMedia('(prefers-color-scheme: light)');
function isDark(){
  const t = document.documentElement.dataset.theme;
  return t ? t === 'dark' : !prefersLight.matches;
}
function paintTheme(){
  const dark = isDark(), b = document.getElementById('themebtn');
  b.textContent = dark ? '☀︎' : '☾';
  b.title = b.ariaLabel = `Switch to ${dark ? 'light' : 'dark'} mode`;
  document.querySelector('meta[name="theme-color"]').content = dark ? '#0f1216' : '#f4f6f9';
}
document.getElementById('themebtn').onclick = () => {
  const next = isDark() ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try{ localStorage.setItem(THEME_KEY, next); }catch(e){}
  paintTheme();
};
prefersLight.addEventListener('change', paintTheme);
paintTheme();

/* ---------- boot ---------- */
if(!S.activeMatch && S.matches.length) S.activeMatch = S.matches.at(-1).id;
render();
resumeSync();
</script>
